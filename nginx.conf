server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;
  location /api/ { proxy_pass http://backend:8081/api/; proxy_http_version 1.1; proxy_set_header Host $host; proxy_set_header X-Real-IP $remote_addr; }
  location /swagger-ui/ { proxy_pass http://backend:8081/swagger-ui/; }
  location /v3/api-docs { proxy_pass http://backend:8081/v3/api-docs; }
  location / { try_files $uri $uri/ /index.html; }
}
